# The app's front door: the built SPA, with /api forwarded to the api container.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    # The api trusts these (trust proxy): the session cookie is Secure only over HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Client-side routes: any path that is not a file is the SPA's.
  location / {
    try_files $uri /index.html;
  }
}
